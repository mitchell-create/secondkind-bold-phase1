[project]
name = "secondkind-bold-phase1"
version = "0.1.0"
description = "Phase 1 creative strategy engine for SecondKind Bold — research, personas, offers, strategy matrix, brand voice, and briefs, with a local dashboard"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "Pillow>=10.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "firecrawl-py>=4.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "pypdfium2>=4.0",        # PDF page rendering for vision (brand enrichment)
    "json-repair>=0.30",     # Tolerant parsing of LLM JSON output
    "exa-py>=1.0",           # Neural web search for unfiltered VoC
    "apify-client>=2.5,<3",  # Amazon + TikTok/Instagram review scraping
    "streamlit>=1.30",       # Local web dashboard
    "openpyxl>=3.1",         # Creative matrix XLSX output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
adc = "cli:cli"

[tool.setuptools]
packages = ["strategy", "models", "validators"]
py-modules = ["cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
